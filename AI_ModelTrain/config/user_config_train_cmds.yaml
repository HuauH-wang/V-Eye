# 9 类命令词 + noise | 复制到 Model Zoo user_config.yaml 后训练
# 复制到: D:\STEdge\stm32ai-modelzoo-services\audio_event_detection\tf\src\user_config.yaml
# class_names 顺序必须与 AI/classes_cmd.txt 一致

operation_mode: chain_tqe

general:
  project_name: voice_cmds_8c_model
  logs_dir: logs
  saved_models_dir: saved_models
  global_seed: 120
  display_figures: True
  gpu_memory_limit: 8
  gpu: True

model:
  model_name: yamnet_e256
  input_shape: (64, 96, 1)
  pretrained_weights: True

dataset:
  dataset_name: custom
  class_names:
    - chaduiwu
    - chahuanjing
    - chayoujian
    - chayundong
    - noise
    - paizhao
    - queren
    - quxiao
    - xiuxiba
  file_extension: '.wav'
  training_audio_path: D:/嵌赛/Audio_esc_cmds/audio
  training_csv_path: D:/嵌赛/Audio_esc_cmds/meta/labels.csv
  validation_split: 0.2
  multi_label: False
  use_garbage_class: False
  expand_last_dim: True
  seed: 120
  to_cache: True
  shuffle: True

preprocessing:
  min_length: 1
  max_length: 10
  target_rate: 16000
  top_db: 60
  frame_length: 3200
  hop_length: 3200
  trim_last_second: False
  lengthen: after

feature_extraction:
  patch_length: 96
  n_mels: 64
  overlap: 0.25
  n_fft: 512
  hop_length: 160
  window_length: 400
  window: hann
  center: False
  pad_mode: constant
  power: 1.0
  fmin: 125
  fmax: 7500
  norm: None
  htk: True
  to_db: False
  include_last_patch: False

data_augmentation:
  GaussianNoise:
    enable: True
    scale: 0.1
  VolumeAugment:
    enable: True
    min_scale: 0.7
    max_scale: 1.3
  SpecAug:
    enable: True
    freq_mask_param: 8
    time_mask_param: 8
    n_freq_mask: 2
    n_time_mask: 2
    mask_value: 0

training:
  fine_tune: True
  dropout: 0.2
  batch_size: 8
  epochs: 100
  optimizer:
    Adam:
      learning_rate: 0.0003
  callbacks:
    ReduceLROnPlateau:
      monitor: val_accuracy
      mode: max
      factor: 0.5
      patience: 30
      min_lr: 1.0e-06
    EarlyStopping:
      monitor: val_accuracy
      mode: max
      restore_best_weights: true
      patience: 40

quantization:
  quantizer: TFLite
  quantization_type: PTQ
  target: int8

tools:
  stedgeai:
    optimization: balanced
    on_cloud: False
    path_to_stedgeai: D:/STEdge/4.0/Utilities/windows/stedgeai.exe
