services:
  postgres:
    image: postgres:16
    container_name: veye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: veye
      POSTGRES_PASSWORD: veye_password
      POSTGRES_DB: veye
    ports:
      - "5432:5432"
    volumes:
      - /data/veye/postgres:/var/lib/postgresql/data
